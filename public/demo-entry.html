<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entry preview · Lockwork</title>
  <style>
    :root { --bg:#f4f6f9; --panel:#ffffff; --line:#d0d5de; --text:#0b1f3a; --muted:#64748b; --accent:#0b1f3a; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); }
    .bar { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); font-size:12px; color:var(--muted); }
    .bar .dot { width:9px; height:9px; border-radius:50%; background:#b8c0cc; }
    .bar .url { margin-left:8px; padding:3px 10px; background:#eef1f6; border:1px solid var(--line); border-radius:3px; flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    main { padding:28px 24px; max-width:880px; margin:0 auto; }
    h1 { font-size:28px; margin:0 0 8px; letter-spacing:-.02em; }
    p { color:var(--muted); margin:0 0 18px; }
    .grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; }
    .tile { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:14px; min-height:84px; }
    .tile b { display:block; font-size:22px; color:var(--accent); }
    .cta { display:inline-block; margin-top:6px; padding:8px 14px; border-radius:3px; background:var(--accent); color:#fff; font-weight:700; }
    .video { aspect-ratio:16/9; border-radius:4px; background:#e8ecf2; border:1px solid var(--line); display:grid; place-items:center; }
    .play { width:64px; height:64px; border-radius:50%; background:#0b1f3a; display:grid; place-items:center; }
    .log { font:12px/1.7 "JetBrains Mono", ui-monospace, monospace; background:#0b1f3a; border:1px solid var(--line); border-radius:4px; padding:14px; color:#cbd5e1; white-space:pre-wrap; }
    .by { margin-top:18px; font-size:12px; color:var(--muted); }
    @media (max-width:560px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url" id="url"></span></div>
  <main id="m"></main>
  <script>
    // Read-only sample deliverable used by the seeded demo entries.
    const q = new URLSearchParams(location.search);
    const kind = q.get('kind') || 'landing';
    const title = q.get('title') || 'Submission';
    const by = q.get('by') || 'Entrant';
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    document.getElementById('url').textContent = `${by.toLowerCase().replace(/\W+/g, '-')}.demo.lockwork.app/${kind}`;
    const views = {
      landing: `<h1>${esc(title)}</h1><p>Mobile-first page with a working waitlist form.</p>
        <div class="grid"><div class="tile"><b>98</b>Lighthouse mobile</div><div class="tile"><b>1.1s</b>LCP</div><div class="tile"><b>412</b>waitlist sign-ups (test)</div></div>
        <p style="margin-top:18px"><span class="cta">Join the waitlist</span></p>`,
      video: `<h1>${esc(title)}</h1><p>30s cut, 16:9 and 9:16, captions burned in.</p><div class="video"><div class="play">▶</div></div>`,
      service: `<h1>${esc(title)}</h1><p>Live service log from the demo environment.</p>
        <div class="log">[12:04:11] watcher: subscribed to 3 treasury addresses on base-sepolia
[12:04:19] rule: outflow &gt; 2,500 USDC → alert
[12:05:02] ALERT  tx 0x9c1e…42af  3,100 USDC → 0x7a2f…c0d1
[12:05:02] notify: telegram ✓  discord ✓  (1.4s)
[12:06:30] dry-run: proposed rebalance 40/60 → awaiting 2-of-3 signers</div>`,
      bot: `<h1>${esc(title)}</h1><p>Autogenerated by a job-scoped bot. Tests and coverage included.</p>
        <div class="grid"><div class="tile"><b>94%</b>test coverage</div><div class="tile"><b>212</b>tests passing</div><div class="tile"><b>0</b>lint errors</div></div>
        <div class="log" style="margin-top:14px">$ npm test
✓ policy.parse rejects unsigned rules
✓ signer.flow requires 2-of-3
✓ dry-run never broadcasts</div>`,
    };
    document.getElementById('m').innerHTML = (views[kind] || views.landing) + `<div class="by">Entry by ${esc(by)} · read-only demo</div>`;
  </script>
</body>
</html>
